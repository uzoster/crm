<!DOCTYPE html>
<html lang="uz" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manady.uz — Professional CRM & Partner Management</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for Excel Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .urgent-reminder {
            animation: pulse-ring 2s infinite;
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
        }
    </style>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col selection:bg-emerald-500 selection:text-white pb-10">

    <!-- Sticky Header -->
    <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-white shadow-md shadow-emerald-900/30">
                    <i class="fa-solid fa-utensils text-lg"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-lg sm:text-xl font-extrabold tracking-tight">Manady<span class="text-emerald-400">.uz</span></h1>
                        <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">PRO CRM</span>
                    </div>
                    <p class="text-[11px] text-slate-400 hidden sm:block">Restoranlar va hamkorlar bazasi</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- Reminder Badge -->
                <button onclick="filterDueReminders()" id="reminder-badge-btn" class="hidden px-3 py-2 rounded-xl text-xs font-bold text-amber-300 bg-amber-500/20 border border-amber-500/40 hover:bg-amber-500/30 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-bell animate-bounce text-amber-400"></i>
                    <span>Eslatmalar (<span id="due-count">0</span>)</span>
                </button>

                <button onclick="openAddModal()" class="px-3 py-2 sm:px-4 sm:py-2 rounded-xl text-xs font-bold text-white bg-blue-600 hover:bg-blue-500 transition flex items-center gap-1.5 shadow-md shadow-blue-900/20">
                    <i class="fa-solid fa-plus"></i>
                    <span>Yangi qo'shish</span>
                </button>
                <button onclick="exportToExcel()" class="px-3 py-2 sm:px-4 sm:py-2 rounded-xl text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-500 transition flex items-center gap-2 shadow-md shadow-emerald-900/20">
                    <i class="fa-solid fa-file-excel"></i>
                    <span class="hidden sm:inline">Excel Export</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-6 flex-1 w-full space-y-4 sm:space-y-6">

        <!-- Loading Spinner -->
        <div id="loading-spinner" class="py-20 text-center">
            <div class="inline-flex p-4 rounded-full bg-emerald-50 text-emerald-600 mb-3 animate-bounce">
                <i class="fa-solid fa-database text-2xl"></i>
            </div>
            <h3 class="text-base font-bold text-slate-800">Ma'lumotlar o'qilmoqda...</h3>
        </div>

        <!-- Main Workspace -->
        <div id="main-content" class="hidden space-y-4 sm:space-y-6">

            <!-- KPI Dashboard -->
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2.5 sm:gap-3.5">
                <div class="bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200/80 shadow-sm flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center text-base font-bold shrink-0"><i class="fa-solid fa-store"></i></div>
                    <div><div class="text-lg font-extrabold text-slate-900" id="stat-total">0</div><div class="text-[11px] font-semibold text-slate-500">Jami Restoranlar</div></div>
                </div>
                <div class="bg-white p-3.5 sm:p-4 rounded-2xl border border-blue-100 shadow-sm flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-base font-bold shrink-0"><i class="fa-solid fa-sparkles"></i></div>
                    <div><div class="text-lg font-extrabold text-blue-700" id="stat-yangi">0</div><div class="text-[11px] font-semibold text-blue-600/80">Yangi</div></div>
                </div>
                <div class="bg-white p-3.5 sm:p-4 rounded-2xl border border-amber-100 shadow-sm flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-base font-bold shrink-0"><i class="fa-solid fa-phone-volume"></i></div>
                    <div><div class="text-lg font-extrabold text-amber-700" id="stat-aloqada">0</div><div class="text-[11px] font-semibold text-amber-600/80">Aloqada</div></div>
                </div>
                <div class="bg-white p-3.5 sm:p-4 rounded-2xl border border-emerald-100 shadow-sm flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-base font-bold shrink-0"><i class="fa-solid fa-handshake"></i></div>
                    <div><div class="text-lg font-extrabold text-emerald-700" id="stat-kelishildi">0</div><div class="text-[11px] font-semibold text-emerald-600/80">Kelishildi</div></div>
                </div>
                <div class="bg-white p-3.5 sm:p-4 rounded-2xl border border-rose-100 shadow-sm flex items-center gap-3 col-span-2 sm:col-span-1">
                    <div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-base font-bold shrink-0"><i class="fa-solid fa-circle-xmark"></i></div>
                    <div><div class="text-lg font-extrabold text-rose-700" id="stat-rad">0</div><div class="text-[11px] font-semibold text-rose-600/80">Rad etildi</div></div>
                </div>
            </div>

            <!-- Search & Filters -->
            <div class="bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                <div class="flex flex-col lg:flex-row gap-3 justify-between items-stretch lg:items-center">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="text" id="search-input" oninput="applyFilters()" placeholder="Nomi, manzili yoki izoh bo'yicha qidirish..." 
                               class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition font-medium">
                    </div>
                    <div class="grid grid-cols-2 sm:flex sm:flex-wrap gap-2">
                        <select id="status-filter" onchange="applyFilters()" class="w-full sm:w-auto px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 focus:outline-none">
                            <option value="">Barcha Statuslar</option>
                            <option value="Yangi">✨ Yangi</option>
                            <option value="Aloqada">📞 Aloqada</option>
                            <option value="Kelishildi">🤝 Kelishildi</option>
                            <option value="Rad etildi">❌ Rad etildi</option>
                        </select>
                        <select id="district-filter" onchange="applyFilters()" class="w-full sm:w-auto px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 focus:outline-none">
                            <option value="">Barcha Tumanlar</option>
                        </select>
                        <select id="category-filter" onchange="applyFilters()" class="col-span-2 sm:col-span-1 w-full sm:w-auto px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 focus:outline-none">
                            <option value="">Barcha Kategoriyalar</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- DESKTOP TABLE VIEW -->
            <div class="hidden md:block bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                <div class="overflow-x-auto custom-scrollbar">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-900 text-slate-300 text-[11px] uppercase tracking-wider font-bold">
                                <th class="py-3.5 px-4 text-center w-10">№</th>
                                <th class="py-3.5 px-4 min-w-[180px]">Restoran Nomi</th>
                                <th class="py-3.5 px-4 min-w-[150px]">Status</th>
                                <th class="py-3.5 px-4">Tuman</th>
                                <th class="py-3.5 px-4">Eslatilgan Vaqt</th>
                                <th class="py-3.5 px-4 min-w-[140px]">Telefon</th>
                                <th class="py-3.5 px-4 text-center">Tezkor Muloqot</th>
                                <th class="py-3.5 px-4 text-center w-16">Batafsil</th>
                            </tr>
                        </thead>
                        <tbody id="restaurant-table-body" class="divide-y divide-slate-100 text-xs font-medium text-slate-700"></tbody>
                    </table>
                </div>
            </div>

            <!-- MOBILE CARDS VIEW -->
            <div id="restaurant-card-grid" class="grid grid-cols-1 gap-3 md:hidden"></div>

            <div id="empty-state" class="hidden py-12 text-center bg-white rounded-2xl border border-slate-200">
                <i class="fa-solid fa-folder-open text-3xl text-slate-300 mb-2"></i>
                <p class="text-sm font-semibold text-slate-600">Hech qanday restoran topilmadi</p>
            </div>

        </div>

    </main>

    <!-- Modal 1: Detail Info -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-2xl shadow-2xl overflow-hidden">
            <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-sm sm:text-base truncate">Restoran Nomi</h3>
                <button onclick="closeModal('detail-modal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-5 space-y-4 max-h-[75vh] overflow-y-auto custom-scrollbar" id="modal-body"></div>
        </div>
    </div>

    <!-- Modal 2: Add New Lead Form -->
    <div id="add-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden p-5 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-slate-900 text-base flex items-center gap-2"><i class="fa-solid fa-plus-circle text-emerald-600"></i> Yangi Lead Qo'shish</h3>
                <button onclick="closeModal('add-modal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="add-lead-form" onsubmit="saveNewLead(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Restoran Nomi *</label>
                    <input type="text" id="new-name" required class="w-full p-2.5 bg-slate-50 border rounded-xl focus:ring-2 focus:ring-emerald-500/20 font-medium">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Tuman</label>
                        <input type="text" id="new-district" placeholder="Masalan: Chilonzor" class="w-full p-2.5 bg-slate-50 border rounded-xl font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Kategoriya</label>
                        <input type="text" id="new-category" placeholder="Masalan: Milliy taomlar" class="w-full p-2.5 bg-slate-50 border rounded-xl font-medium">
                    </div>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Telefon raqami</label>
                    <input type="text" id="new-phone" placeholder="+998 90 123 45 67" class="w-full p-2.5 bg-slate-50 border rounded-xl font-medium">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Telegram (Username/Link)</label>
                    <input type="text" id="new-telegram" placeholder="@username" class="w-full p-2.5 bg-slate-50 border rounded-xl font-medium">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Izoh</label>
                    <textarea id="new-notes" rows="2" class="w-full p-2.5 bg-slate-50 border rounded-xl font-medium"></textarea>
                </div>
                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onclick="closeModal('add-modal')" class="px-4 py-2 bg-slate-100 text-slate-600 font-bold rounded-xl">Bekor qilish</button>
                    <button type="submit" class="px-5 py-2 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-500 shadow-md">Saqlash</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Logic Script -->
    <script>
        const EXCEL_FILE_PATH = './data/Toshkent_Restoranlar.xlsx';
        const STORAGE_KEY = 'manady_restaurants_crm_v3';
        const DEFAULT_MSG = "Assalomu alaykum! Manady.uz loyihasidan bog'lanmoqdamiz. Restoraningiz bilan hamkorlik bo'yicha gaplashsak bo'ladimi?";

        let restaurants = [];
        let filteredData = [];
        let notifiedIds = new Set(); // Qayta bildirishnoma chiqmasligi uchun

        document.addEventListener("DOMContentLoaded", () => { 
            initApp();
            requestNotificationPermission();
            setInterval(checkReminderSystem, 15000); // Har 15 sekunda vaqtni tekshiradi
        });

        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }

        async function initApp() {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                try {
                    restaurants = JSON.parse(savedData);
                    renderApp();
                    return;
                } catch (e) { console.error(e); }
            }
            await loadExcelAuto();
        }

        async function loadExcelAuto() {
            document.getElementById('loading-spinner').classList.remove('hidden');
            document.getElementById('main-content').classList.add('hidden');

            try {
                const response = await fetch(EXCEL_FILE_PATH);
                if (!response.ok) throw new Error(`Faylni o'qib bo'lmadi`);
                
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                parseAndSetData(json);
                saveToLocalStorage();
                renderApp();

            } catch (error) {
                document.getElementById('loading-spinner').innerHTML = `<p class="text-rose-600 font-bold text-xs">Excel fayli yuklanmadi. Live Server va fayl yo'lini tekshiring.</p>`;
            }
        }

        function renderApp() {
            filteredData = [...restaurants];
            populateFilterDropdowns();
            applyFilters();
            checkReminderSystem();
            document.getElementById('loading-spinner').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
        }

        function parseAndSetData(json) {
            if (json.length < 2) return;
            restaurants = [];
            for (let i = 1; i < json.length; i++) {
                const row = json[i];
                if (!row || row.length === 0) continue;

                restaurants.push({
                    id: Date.now() + i,
                    name: row[1] || 'Nomsiz Restoran',
                    category: row[2] || 'Umumiy',
                    district: row[3] || 'Toshkent',
                    address: row[4] || '-',
                    phone: row[5] || '',
                    instagram: row[6] || '',
                    telegram: row[7] || '',
                    website: row[8] || '',
                    maps: row[9] || '',
                    work_hours: row[10] || 'Ko\'rsatilmadi',
                    status: 'Yangi',
                    notes: row[12] || '',
                    followUpDate: ''
                });
            }
        }

        function updateStatus(id, newStatus) {
            const item = restaurants.find(r => r.id === id);
            if (item) {
                item.status = newStatus;
                saveToLocalStorage();
                applyFilters();
            }
        }

        function updateFollowUp(id, dateVal) {
            const item = restaurants.find(r => r.id === id);
            if (item) {
                item.followUpDate = dateVal;
                notifiedIds.delete(id); // Qayta vaqt biriktirilsa, eski bildirishnomani tozalaymiz
                saveToLocalStorage();
                applyFilters();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(restaurants));
        }

        // ESLAТMA VA NOTIFICATION TIZIMI (REAL-TIME)
        function checkReminderSystem() {
            const now = new Date();
            const currentIsoMin = now.toISOString().slice(0, 16);
            let dueItemsCount = 0;

            restaurants.forEach(item => {
                if (item.followUpDate) {
                    const itemDate = new Date(item.followUpDate);
                    // Vaqti yetgan yoki o'tib ketgan eslatmalar
                    if (itemDate <= now) {
                        dueItemsCount++;

                        // Dastlabki marta vaqti kelganda Notification chiqaradi
                        if (!notifiedIds.has(item.id) && item.followUpDate.slice(0, 16) <= currentIsoMin) {
                            sendBrowserNotification(item);
                            notifiedIds.add(item.id);
                        }
                    }
                }
            });

            // Headerdagi eslatma belgisini yangilash
            const badgeBtn = document.getElementById('reminder-badge-btn');
            const dueCountSpan = document.getElementById('due-count');
            
            if (dueItemsCount > 0) {
                badgeBtn.classList.remove('hidden');
                dueCountSpan.innerText = dueItemsCount;
            } else {
                badgeBtn.classList.add('hidden');
            }
        }

        function sendBrowserNotification(item) {
            const title = `📞 Qo'ng'iroq Vaqti Bo'ldi!`;
            const body = `${item.name}\nTel: ${item.phone || 'Biriktirilmagan'}\nIzoh: ${item.notes || 'Yo\'q'}`;

            if ("Notification" in window && Notification.permission === "granted") {
                const notif = new Notification(title, { body, icon: 'https://cdn-icons-png.flaticon.com/512/3616/3616215.png' });
                notif.onclick = () => { window.focus(); openModal(item.id); };
            } else {
                alert(`🔔 ESLATMA!\n\n${body}`);
            }
        }

        function filterDueReminders() {
            const now = new Date();
            filteredData = restaurants.filter(r => r.followUpDate && new Date(r.followUpDate) <= now);
            renderData();
        }

        function populateFilterDropdowns() {
            const districts = [...new Set(restaurants.map(r => r.district).filter(Boolean))].sort();
            const categories = [...new Set(restaurants.map(r => r.category).filter(Boolean))].sort();

            populateSelect('district-filter', districts, 'Barcha Tumanlar');
            populateSelect('category-filter', categories, 'Barcha Kategoriyalar');
        }

        function populateSelect(id, items, defaultText) {
            const select = document.getElementById(id);
            const curr = select.value;
            select.innerHTML = `<option value="">${defaultText}</option>`;
            items.forEach(item => { select.innerHTML += `<option value="${item}">${item}</option>`; });
            select.value = curr;
        }

        function applyFilters() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const status = document.getElementById('status-filter').value;
            const district = document.getElementById('district-filter').value;
            const category = document.getElementById('category-filter').value;

            filteredData = restaurants.filter(item => {
                const matchesQuery = !query || item.name.toLowerCase().includes(query) || (item.address && item.address.toLowerCase().includes(query));
                const matchesStatus = !status || item.status === status;
                const matchesDistrict = !district || item.district === district;
                const matchesCategory = !category || item.category === category;
                return matchesQuery && matchesStatus && matchesDistrict && matchesCategory;
            });

            renderData();
        }

        function renderData() {
            updateStats();
            const tbody = document.getElementById('restaurant-table-body');
            const cardGrid = document.getElementById('restaurant-card-grid');
            const emptyState = document.getElementById('empty-state');
            const now = new Date();

            tbody.innerHTML = ''; cardGrid.innerHTML = '';

            if (filteredData.length === 0) {
                emptyState.classList.remove('hidden'); return;
            } else { emptyState.classList.add('hidden'); }

            filteredData.forEach((item, index) => {
                const tgLink = formatTgLink(item.telegram, item.phone);
                const isUrgent = item.followUpDate && new Date(item.followUpDate) <= now;

                // Desktop Row
                const row = document.createElement('tr');
                row.className = `transition border-b border-slate-100 ${isUrgent ? 'bg-amber-50/70 border-amber-200 font-semibold' : 'hover:bg-slate-50'}`;
                row.innerHTML = `
                    <td class="py-3.5 px-4 text-center font-bold text-slate-400">${index + 1}</td>
                    <td class="py-3.5 px-4">
                        <div class="font-bold text-slate-900 text-xs hover:text-emerald-600 cursor-pointer flex items-center gap-1.5" onclick="openModal(${item.id})">
                            ${isUrgent ? '<i class="fa-solid fa-bell text-rose-500 animate-bounce"></i>' : ''}
                            <span>${item.name}</span>
                        </div>
                        <div class="text-[11px] text-slate-400 font-normal truncate max-w-[180px]">${item.address}</div>
                    </td>
                    <td class="py-3.5 px-4">${renderStatusSelector(item.id, item.status)}</td>
                    <td class="py-3.5 px-4 font-semibold text-slate-600">${item.district}</td>
                    <td class="py-3.5 px-4">
                        ${item.followUpDate ? `<span class="px-2 py-1 rounded-lg text-[10px] font-bold ${isUrgent ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-600'}">${item.followUpDate.replace('T', ' ')}</span>` : '<span class="text-slate-300">-</span>'}
                    </td>
                    <td class="py-3.5 px-4 font-mono text-xs">${renderPhoneCallButton(item.phone)}</td>
                    <td class="py-3.5 px-4 text-center">
                        <div class="flex items-center justify-center gap-1.5">
                            ${tgLink ? `<a href="${tgLink}" target="_blank" title="Telegram-da yozish" class="w-7 h-7 rounded-lg bg-sky-50 text-sky-500 flex items-center justify-center hover:bg-sky-500 hover:text-white transition"><i class="fa-brands fa-telegram"></i></a>` : ''}
                            ${item.instagram ? `<a href="${formatUrl(item.instagram, 'instagram')}" target="_blank" class="w-7 h-7 rounded-lg bg-pink-50 text-pink-600 flex items-center justify-center hover:bg-pink-600 hover:text-white transition"><i class="fa-brands fa-instagram"></i></a>` : ''}
                            ${item.maps ? `<a href="${item.maps}" target="_blank" class="w-7 h-7 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center hover:bg-amber-600 hover:text-white transition"><i class="fa-solid fa-map-location-dot"></i></a>` : ''}
                        </div>
                    </td>
                    <td class="py-3.5 px-4 text-center">
                        <button onclick="openModal(${item.id})" class="p-1.5 rounded-lg text-slate-400 hover:text-emerald-600 transition"><i class="fa-solid fa-eye"></i></button>
                    </td>
                `;
                tbody.appendChild(row);

                // Mobile Card
                const card = document.createElement('div');
                card.className = `p-4 rounded-2xl border shadow-sm space-y-3 transition ${isUrgent ? 'urgent-reminder' : 'bg-white border-slate-200/80'}`;
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2">
                        <div>
                            <span class="text-[10px] font-bold text-slate-400 uppercase">#${index + 1} • ${item.district}</span>
                            <h3 class="font-extrabold text-slate-900 text-sm cursor-pointer flex items-center gap-1.5" onclick="openModal(${item.id})">
                                ${isUrgent ? '<i class="fa-solid fa-bell text-rose-500 animate-bounce"></i>' : ''}
                                <span>${item.name}</span>
                            </h3>
                        </div>
                        <span class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded-md text-[10px] font-semibold">${item.category}</span>
                    </div>

                    ${item.followUpDate ? `
                        <div class="p-2 rounded-xl text-[11px] font-bold ${isUrgent ? 'bg-rose-100 text-rose-800' : 'bg-slate-100 text-slate-600'} flex items-center gap-1.5">
                            <i class="fa-regular fa-clock"></i> Eslatilgan vaqt: ${item.followUpDate.replace('T', ' ')}
                        </div>
                    ` : ''}

                    <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl">
                        <span class="text-[11px] font-bold text-slate-500">Status:</span>
                        ${renderStatusSelector(item.id, item.status)}
                    </div>

                    <div class="flex items-center gap-2">
                        <div class="flex-1">${renderPhoneCallButton(item.phone, true)}</div>
                        <div class="flex gap-1.5">
                            ${tgLink ? `<a href="${tgLink}" target="_blank" class="w-9 h-9 rounded-xl bg-sky-50 text-sky-500 flex items-center justify-center"><i class="fa-brands fa-telegram"></i></a>` : ''}
                            <button onclick="openModal(${item.id})" class="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center"><i class="fa-solid fa-ellipsis"></i></button>
                        </div>
                    </div>
                `;
                cardGrid.appendChild(card);
            });
        }

        function renderPhoneCallButton(phoneStr, fullWidth = false) {
            if (!phoneStr) return `<span class="text-slate-400 text-xs italic">Mavjud emas</span>`;
            const cleanPhone = phoneStr.replace(/[^0-9+]/g, '');
            return `
                <a href="tel:${cleanPhone}" class="${fullWidth ? 'w-full justify-center' : ''} inline-flex items-center gap-2 px-3 py-1.5 bg-emerald-50 hover:bg-emerald-600 text-emerald-700 hover:text-white rounded-xl font-bold text-xs transition border border-emerald-200/60">
                    <i class="fa-solid fa-phone"></i>
                    <span>${phoneStr}</span>
                </a>
            `;
        }

        function renderStatusSelector(id, currentStatus) {
            let badgeStyle = "bg-slate-100 text-slate-700 border-slate-200";
            if (currentStatus === 'Yangi') badgeStyle = "bg-blue-50 text-blue-700 border-blue-200";
            if (currentStatus === 'Aloqada') badgeStyle = "bg-amber-50 text-amber-700 border-amber-200";
            if (currentStatus === 'Kelishildi') badgeStyle = "bg-emerald-50 text-emerald-700 border-emerald-200";
            if (currentStatus === 'Rad etildi') badgeStyle = "bg-rose-50 text-rose-700 border-rose-200";

            return `
                <select onchange="updateStatus(${id}, this.value)" class="text-xs font-bold px-2 py-1 rounded-xl border cursor-pointer ${badgeStyle}">
                    <option value="Yangi" ${currentStatus === 'Yangi' ? 'selected' : ''}>✨ Yangi</option>
                    <option value="Aloqada" ${currentStatus === 'Aloqada' ? 'selected' : ''}>📞 Aloqada</option>
                    <option value="Kelishildi" ${currentStatus === 'Kelishildi' ? 'selected' : ''}>🤝 Kelishildi</option>
                    <option value="Rad etildi" ${currentStatus === 'Rad etildi' ? 'selected' : ''}>❌ Rad etildi</option>
                </select>
            `;
        }

        function formatTgLink(tg, phone) {
            let target = '';
            if (tg) target = tg.replace('@', '').replace('https://t.me/', '');
            else if (phone) target = phone.replace(/[^0-9]/g, '');
            if (!target) return null;

            return `https://t.me/${target}?text=${encodeURIComponent(DEFAULT_MSG)}`;
        }

        function formatUrl(val, type) {
            if (!val) return '#';
            if (val.startsWith('http')) return val;
            if (type === 'instagram') return `https://instagram.com/${val.replace('@','')}`;
            return val;
        }

        function updateStats() {
            document.getElementById('stat-total').innerText = restaurants.length;
            document.getElementById('stat-yangi').innerText = restaurants.filter(r => r.status === 'Yangi').length;
            document.getElementById('stat-aloqada').innerText = restaurants.filter(r => r.status === 'Aloqada').length;
            document.getElementById('stat-kelishildi').innerText = restaurants.filter(r => r.status === 'Kelishildi').length;
            document.getElementById('stat-rad').innerText = restaurants.filter(r => r.status === 'Rad etildi').length;
        }

        // Modal Handlers
        function openModal(id) {
            const item = restaurants.find(r => r.id === id);
            if (!item) return;

            document.getElementById('modal-title').innerText = item.name;
            const modalBody = document.getElementById('modal-body');

            modalBody.innerHTML = `
                <div class="space-y-4 text-xs">
                    <div class="p-3 bg-slate-50 rounded-xl border flex justify-between items-center">
                        <span class="font-bold text-slate-500">Status:</span>
                        ${renderStatusSelector(item.id, item.status)}
                    </div>

                    <div class="p-3 bg-amber-50/60 rounded-xl border border-amber-200/60 space-y-1">
                        <label class="block font-bold text-amber-800 text-[11px]"><i class="fa-regular fa-clock"></i> Qayta bog'lanish vaqti (Eslatma):</label>
                        <input type="datetime-local" value="${item.followUpDate || ''}" onchange="updateFollowUp(${item.id}, this.value)" class="w-full p-2 bg-white border rounded-lg text-xs font-semibold">
                    </div>

                    <div>
                        <span class="text-slate-400 font-bold block text-[10px] uppercase">Aloqa</span>
                        <div class="mt-1 flex gap-2">
                            ${renderPhoneCallButton(item.phone, true)}
                        </div>
                    </div>

                    <div>
                        <span class="text-slate-400 font-bold block text-[10px] uppercase">To'liq Manzil</span>
                        <p class="font-semibold text-slate-800 mt-0.5">${item.address}</p>
                    </div>

                    <div>
                        <span class="text-slate-400 font-bold block text-[10px] uppercase">Izoh</span>
                        <p class="font-medium text-slate-700 bg-slate-50 p-2.5 rounded-xl border mt-1">${item.notes || 'Izoh mavjud emas'}</p>
                    </div>
                </div>
            `;
            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function openAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        function saveNewLead(e) {
            e.preventDefault();
            const newLead = {
                id: Date.now(),
                name: document.getElementById('new-name').value,
                district: document.getElementById('new-district').value || 'Toshkent',
                category: document.getElementById('new-category').value || 'Umumiy',
                phone: document.getElementById('new-phone').value,
                telegram: document.getElementById('new-telegram').value,
                address: '-',
                instagram: '',
                maps: '',
                work_hours: 'Ko\'rsatilmadi',
                status: 'Yangi',
                notes: document.getElementById('new-notes').value,
                followUpDate: ''
            };

            restaurants.unshift(newLead);
            saveToLocalStorage();
            populateFilterDropdowns();
            applyFilters();
            closeModal('add-modal');
            document.getElementById('add-lead-form').reset();
        }

        function exportToExcel() {
            const dataToExport = restaurants.map((r, idx) => ({
                "№": idx + 1,
                "Restoran nomi": r.name,
                "Status": r.status,
                "Kategoriya": r.category,
                "Tuman": r.district,
                "Telefon": r.phone,
                "Eslatma sanasi": r.followUpDate || '',
                "Izoh": r.notes
            }));

            const worksheet = XLSX.utils.json_to_sheet(dataToExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Restoranlar");
            XLSX.writeFile(workbook, `Manady_CRM_${new Date().toISOString().slice(0,10)}.xlsx`);
        }
    </script>
</body>
</html>
